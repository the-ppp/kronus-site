<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kronus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { max-width: 400px; width: 100%; text-align: center; }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 48px; }
    .icon { font-size: 48px; margin-bottom: 24px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 12px; }
    p { font-size: 15px; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block; background: #fff; color: #000;
      font-size: 15px; font-weight: 700; text-decoration: none;
      padding: 14px 32px; border-radius: 12px; letter-spacing: -0.2px;
    }
    .error { color: #FF6B6B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Kronus</div>
    <div class="icon" id="icon">✓</div>
    <h1 id="title">Email confirmed</h1>
    <p id="message">Your account is ready. Open the Kronus app to continue.</p>
    <a href="mydailylog://auth/callback" class="btn" id="btn">Open Kronus</a>
  </div>
  <script>
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const params = new URLSearchParams(window.location.search);
    const error = hash.get('error') || params.get('error');
    const errorDesc = hash.get('error_description') || params.get('error_description');

    if (error) {
      document.getElementById('icon').textContent = '✕';
      document.getElementById('icon').classList.add('error');
      document.getElementById('title').textContent = 'Link expired';
      document.getElementById('message').textContent =
        errorDesc && errorDesc.toLowerCase().includes('expired')
          ? 'This confirmation link has expired. Please request a new one from the app.'
          : 'Something went wrong. Please try again from the app.';
    } else {
      const access_token = hash.get('access_token');
      const refresh_token = hash.get('refresh_token');
      const code = params.get('code');
      if (code) {
        document.getElementById('btn').href = `mydailylog://auth/callback?code=${code}`;
      } else if (access_token && refresh_token) {
        document.getElementById('btn').href =
          `mydailylog://auth/callback#access_token=${access_token}&refresh_token=${refresh_token}`;
      }
      // Auto-open the app
      setTimeout(() => document.getElementById('btn').click(), 500);
    }
  </script>
</body>
</html>
